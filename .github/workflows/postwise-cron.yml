# Free scheduler. Vercel's Hobby plan only fires crons once a day; GitHub
# Actions has no such limit and costs nothing. Both are wired up — delete
# whichever one you don't want.
#
# Add repo secrets: POSTWISE_URL (https://your-app.vercel.app), CRON_SECRET
name: postwise cron

on:
  schedule:
    - cron: '30 14 * * *'   # 20:00 IST daily — commits, trends, check-in
    - cron: '0 5 * * 0'     # 10:30 IST Sunday — weekly angles
  workflow_dispatch:
    inputs:
      job:
        description: job to run
        default: daily

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: pick job
        id: job
        run: |
          if [ "${{ github.event.schedule }}" = "0 5 * * 0" ]; then
            echo "name=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.job || 'daily' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: trigger
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 120 -w '\n%{http_code}' \
            "${{ secrets.POSTWISE_URL }}/api/cron?job=${{ steps.job.outputs.name }}&secret=${{ secrets.CRON_SECRET }}")
          status=$(tail -n1 <<<"$body")
          payload=$(sed '$d' <<<"$body")
          echo "$payload"
          # Spent free-tier quota is expected and transient; only real breakage
          # should turn the run red, or red stops meaning anything.
          if grep -q '"quotaExhausted":true' <<<"$payload"; then
            echo "::warning title=Gemini quota::${{ steps.job.outputs.name }}: daily free-tier quota is spent, resumes after Google resets it"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error title=Cron failed::${{ steps.job.outputs.name }} returned HTTP $status"
            exit 1
          fi

      # Draft top-up is a separate call: repo summarising and draft generation
      # together do not fit in one 60s serverless invocation.
      - name: top up drafts
        if: steps.job.outputs.name == 'daily'
        run: |
          set -uo pipefail
          body=$(curl -sS --max-time 120 -w '\n%{http_code}' \
            "${{ secrets.POSTWISE_URL }}/api/cron?job=drafts&secret=${{ secrets.CRON_SECRET }}")
          status=$(tail -n1 <<<"$body")
          payload=$(sed '$d' <<<"$body")
          echo "$payload"
          # Spent free-tier quota is expected and transient; only real breakage
          # should turn the run red, or red stops meaning anything.
          if grep -q '"quotaExhausted":true' <<<"$payload"; then
            echo "::warning title=Gemini quota::drafts: daily free-tier quota is spent, resumes after Google resets it"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error title=Cron failed::drafts returned HTTP $status"
            exit 1
          fi
